[build-system]
requires = ["briefcase"]

[tool.briefcase]
project_name = "AniSyns"
bundle = "com.watch"
version = "1.0.0"
url = "https://github.com/Anime-Fun-Glitch/IOS-App"
license = "LicenseRef-Personal-Use"
license-files = ["LICENSE"]
author = "SberKon"
author_email = "noreply@users.noreply.github.com"

[tool.briefcase.app.anisyns]
formal_name = "AniSyns"
description = "The way to watch Anime with comfort!"
icon = "resources/anisyns"
splash_background_color = "#0d0e13"
sources = ["src/anisyns"]
requires = ["requests"]

[tool.briefcase.app.anisyns.iOS]
requires = ["toga-iOS", "pillow"]
info."UIFileSharingEnabled" = true
info."NSLocalNetworkUsageDescription" = "AniSyns шукає ваші інші пристрої в локальній мережі, щоб синхронізувати бібліотеку."
info."LSSupportsOpeningDocumentsInPlace" = true
info."UIUserInterfaceStyle" = "Dark"
