name: Build PC

on:
  workflow_dispatch:
    inputs:
      windows: { description: 'Windows', type: boolean, default: true }
      macos: { description: 'macOS', type: boolean, default: false }
      linux: { description: 'Linux', type: boolean, default: false }
  push:
    branches: [main, master]
    paths: ['src/anisyns/anime_app.py', 'pc/**', '.github/workflows/build-pc.yml']

# Вимикач: GitHub → Settings → Secrets and variables → Actions → Variables → BUILD_PC = false
# (ручний запуск «Run workflow» працює завжди; вимикач стосується лише автозапуску після push)
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.BUILD_PC != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Пропустити зайву систему
        id: go
        shell: bash
        run: |
          W='${{ github.event.inputs.windows }}'; M='${{ github.event.inputs.macos }}'; L='${{ github.event.inputs.linux }}'
          ok=true
          if [ '${{ github.event_name }}' = workflow_dispatch ]; then
            case '${{ matrix.os }}' in windows-latest) [ "$W" = true ] || ok=false;; macos-latest) [ "$M" = true ] || ok=false;; *) [ "$L" = true ] || ok=false;; esac
          else
            [ '${{ matrix.os }}' = windows-latest ] || ok=false   # після push збирається лише Windows
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.go.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.go.outputs.ok == 'true'
        with: { python-version: '3.12' }
      - name: Залежності
        if: steps.go.outputs.ok == 'true'
        run: pip install pyinstaller pywebview requests pillow
      - name: Залежності Linux
        if: steps.go.outputs.ok == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev || true
      - name: Збірка
        if: steps.go.outputs.ok == 'true'
        shell: bash
        run: |
          SEP=':'; [ "$RUNNER_OS" = Windows ] && SEP=';'
          pyinstaller --noconfirm --windowed --name AniSyns --collect-all requests --hidden-import requests --hidden-import PIL --add-data "src/anisyns/anime_app.py${SEP}." pc/anisyns_pc.py
      - uses: actions/upload-artifact@v4
        if: steps.go.outputs.ok == 'true'
        with:
          name: AniSyns-${{ matrix.os }}
          path: dist/
