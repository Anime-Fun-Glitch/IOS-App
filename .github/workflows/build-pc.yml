name: Build PC

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['src/anisyns/anime_app.py', 'pc/**', '.github/workflows/build-pc.yml']

# Вимикач: GitHub → Settings → Secrets and variables → Actions → Variables → BUILD_PC = false
# (ручний запуск «Run workflow» працює завжди; вимикач стосується лише автозапуску після push)
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.BUILD_PC != 'false'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Сервер (Python → AniSynsServer.exe)
        shell: bash
        run: |
          pip install pyinstaller requests pillow
          pyinstaller --noconfirm --noconsole --onedir --name AniSynsServer \
            --icon pc/host/app.ico --version-file pc/version.txt \
            --collect-all requests --hidden-import PIL \
            --paths src/anisyns --hidden-import anime_app \
            --distpath pc/server-dist --workpath pc/build \
            pc/server_main.py

      - name: Вікно (C# + WebView2 → AniSyns.exe)
        run: dotnet publish pc/host/AniSynsHost.csproj -c Release -r win-x64 --self-contained true -o pc/host/publish

      - name: Інсталятор (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" pc/installer/AniSyns.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: AniSyns-Setup
          path: pc/installer/out/AniSyns-Setup.exe
